<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Agent</title>
    <link rel="stylesheet" href="css/landing.css">
</head>
<body>
    <main class="landing-shell">
        <section class="landing-card" aria-labelledby="page-title">
            <span class="eyebrow"><span class="eyebrow-dot"></span> AI-powered practice</span>
            <h1 id="page-title">AI Interview Agent</h1>
            <p class="subtitle">Practice technical interviews with an AI interviewer.</p>
            <p class="typewriter" aria-label="Prepare. Practice. Improve.">Prepare. Practice. Improve.</p>

            <form id="start-form" class="start-form">
                <label for="candidate-id">Candidate ID</label>
                <div class="input-wrap">
                    <input id="candidate-id" name="candidateId" type="text" value="CAND-001" autocomplete="off" required>
                </div>
                <button type="submit" id="start-button">Start Interview <span aria-hidden="true">→</span></button>
            </form>

            <p class="supporting-text">Personalized questions based on your curriculum journey.</p>
            <p id="status" class="status" aria-live="polite"></p>
        </section>
    </main>
    <script src="js/landing.js"></script>
</body>
</html>
